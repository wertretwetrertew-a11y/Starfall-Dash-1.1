<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starfall Dash — Balance Editor</title><style>
body{margin:0;background:#070b18;color:#eef;font:14px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 6px}.muted{opacity:.65}.toolbar{position:sticky;top:0;background:#0b1020ee;padding:12px 0;z-index:5;display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 14px;background:#202a48;color:#fff;font-weight:800;cursor:pointer}button.primary{background:#6d5dfc}.card{background:#10172b;border:1px solid #263454;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field span{font-size:11px;opacity:.65}.field input{background:#080d1d;color:#fff;border:1px solid #2d3b5d;border-radius:8px;padding:9px}.stage{border-left:3px solid #7cffb2}.status{min-height:24px;margin-top:10px}.danger{color:#ff879b}.success{color:#7cffb2}.success a{color:#7cffb2;font-weight:800} .tabs{display:flex;gap:8px;margin:14px 0}.tab.active{background:#6d5dfc}.bug-card{border-left:4px solid #6d5dfc}.bug-card.critical{border-left-color:#ff536b}.bug-card.high{border-left-color:#ffad42}.bug-card.medium{border-left-color:#f5d85b}.bug-card.low{border-left-color:#70d6ff}.bug-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bug-actions select,.new-bug input,.new-bug textarea,.new-bug select{background:#080d1d;color:#fff;border:1px solid #2d3b5d;border-radius:8px;padding:9px}.new-bug{display:grid;gap:10px}.new-bug textarea{min-height:70px;resize:vertical}.enemy-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}.enemy-option{display:flex;align-items:center;gap:8px;background:#080d1d;border:1px solid #2d3b5d;border-radius:9px;padding:9px;cursor:pointer}.enemy-option input{accent-color:#6d5dfc}.enemy-option span{font-weight:700}.stage-meta{margin:0 0 10px;opacity:.7;font-size:12px}</style></head><body><main>
<h1>🛠 Starfall Dash — Balance Editor</h1><div class="muted">Локальный Dev Tool. Он не является частью игровой сборки.</div><div class="tabs"><button class="tab active" onclick="showSection('balance')">⚙️ Баланс</button><button class="tab" onclick="showSection('bugs')">🐞 Баги</button></div>
<div class="toolbar"><button class="primary" onclick="save(false)">💾 Сохранить</button><button onclick="save(true)">💾 Сохранить + Git commit</button><button class="primary" onclick="saveToGithub()">☁️ Сохранить в текущую Git-ветку</button><button onclick="location.reload()">↻ Перезагрузить</button></div>
<div id="balance-section"><div id="app"></div></div><div id="bugs-section" style="display:none"><div id="bugs-app"></div></div><div id="status" class="status"></div>
<script>
const TOKEN=new URLSearchParams(location.search).get("token")||location.hash.slice(1);let data;
async function init(){data=await(await fetch("/api/balance?token="+encodeURIComponent(TOKEN))).json();render()}
function inp(path,label,value,step="1"){return '<label class="field"><span>'+label+'</span><input data-path="'+path+'" data-kind="number" type="number" step="'+step+'" value="'+value+'"></label>'} function textInp(path,label,value){return '<label class="field"><span>'+label+'</span><input data-path="'+path+'" data-kind="text" type="text" value="'+(value||[]).join(", ")+'"></label>'}
const enemyNames={normal:"Обычный",flyer:"Летающий",zigzag:"Зигзаг",ghost:"Призрак",hunter:"Охотник",snake:"Змея",bomber:"Бомбардировщик",splitter:"Сплиттер",spider:"Паук",ice:"Лёд",star:"Звезда",miniboss:"Мини-босс",crystal:"Кристалл",barrier:"Барьер",teleporter:"Телепортер",magnet_enemy:"Магнит",doppel:"Двойник",laser:"Лазер"};
function stageEnemyPicker(planet,i,pool){
 const keys=Object.keys(data.rogue.enemies);
 return '<div><div class="stage-meta">Выбери, какие враги могут появляться на этом этапе:</div><div class="enemy-picker">'+keys.map(k=>'<label class="enemy-option"><input type="checkbox" data-stage-planet="'+planet+'" data-stage-index="'+i+'" data-enemy="'+k+'" '+(pool.includes(k)?'checked':'')+'><span>'+(enemyNames[k]||k)+'</span></label>').join('')+'</div></div>';
}
function render(){
 let h='<div class="card"><h2>⚙️ Система спавна</h2><div class="grid">'+inp("rogue.spawn.minIntervalFrames","Мин. интервал",data.rogue.spawn.minIntervalFrames)+inp("rogue.spawn.pressureIntervalFrames","Давление: интервал",data.rogue.spawn.pressureIntervalFrames)+inp("rogue.spawn.pressureMaxPerTick","Давление: максимум",data.rogue.spawn.pressureMaxPerTick)+'</div></div>';
 for(const [planet,stages] of Object.entries(data.rogue.stages)){h+='<div class="card"><h2>🪐 '+planet.toUpperCase()+'</h2>';stages.forEach((s,i)=>{h+='<div class="card stage"><h3>Этап '+(i+1)+'</h3>'+stageEnemyPicker(planet,i,s.pool)+'<div class="grid">'+inp("rogue.stages."+planet+"."+i+".spawnInterval","Спавн (кадры)",s.spawnInterval)+inp("rogue.stages."+planet+"."+i+".maxAlive","Макс. врагов",s.maxAlive)+inp("rogue.stages."+planet+"."+i+".minAlive","Мин. врагов",s.minAlive)+inp("rogue.stages."+planet+"."+i+".speedMult","Множитель скорости",s.speedMult,"0.01")+inp("rogue.stages."+planet+"."+i+".hpMult","Множитель HP",s.hpMult,"0.01")+inp("rogue.stages."+planet+"."+i+".objective.target","Цель этапа",s.objective.target)+'</div></div>'});h+='</div>'}
 h+='<div class="card"><h2>👾 Враги — базовые параметры</h2><div class="muted">HP задаётся отдельно для каждого типа. Множитель HP этапа применяется сверху.</div><div class="grid">';for(const[k,e]of Object.entries(data.rogue.enemies)){h+='<div class="card"><h3>'+(enemyNames[k]||k)+'</h3><div class="muted">'+k+'</div><div class="grid">'+inp("rogue.enemies."+k+".hp","HP",e.hp)+inp("rogue.enemies."+k+".speed","Скорость",e.speed,"0.1")+inp("rogue.enemies."+k+".size","Размер",e.size)+'</div></div>'}h+='</div></div>';
 h+='<div class="card"><h2>👑 Боссы</h2><div class="grid">';for(const[k,b]of Object.entries(data.rogue.bosses)){h+='<div class="card"><h3>'+k+'</h3><div class="grid">'+inp("rogue.bosses."+k+".hp","HP",b.hp)+inp("rogue.bosses."+k+".size","Размер",b.size)+inp("rogue.bosses."+k+".rewardGold","Золото",b.rewardGold)+inp("rogue.bosses."+k+".rewardCrystals","Кристаллы",b.rewardCrystals)+'</div></div>'}h+='</div></div>';
 document.getElementById("app").innerHTML=h;
 document.querySelectorAll("[data-stage-planet]").forEach(el=>el.addEventListener("change",()=>{
   const p=el.dataset.stagePlanet,i=Number(el.dataset.stageIndex);
   data.rogue.stages[p][i].pool=[...document.querySelectorAll('[data-stage-planet="'+p+'"][data-stage-index="'+i+'"]:checked')].map(x=>x.dataset.enemy);
 }));
}
function showSection(name){document.getElementById("balance-section").style.display=name==="balance"?"block":"none";document.getElementById("bugs-section").style.display=name==="bugs"?"block":"none";document.querySelectorAll(".tab").forEach((b,i)=>b.classList.toggle("active",(name==="balance"&&i===0)||(name==="bugs"&&i===1)));if(name==="bugs")loadBugs()}
const priorityLabels={critical:"🔴 Критический",high:"🟠 Высокий",medium:"🟡 Средний",low:"🟢 Низкий"};
const statusLabels={open:"❌ Не исправлен",working:"🔧 Исправляется",testing:"🧪 Проверяется",fixed:"✅ Исправлен"};
let bugs=[];
async function loadBugs(){const r=await fetch("/api/bugs?token="+encodeURIComponent(TOKEN));const j=await r.json();bugs=j.bugs||[];renderBugs()}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function renderBugs(){bugs.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))||b.id-a.id);let h='<div class="card"><h2>🐞 Реестр багов</h2><div class="muted">Новые баги всегда сверху. Статус и важность сохраняются в Git.</div></div><div class="card new-bug"><h2>➕ Добавить баг</h2><input id="bug-title" placeholder="Название бага"><select id="bug-priority"><option value="critical">🔴 Критический</option><option value="high">🟠 Высокий</option><option value="medium" selected>🟡 Средний</option><option value="low">🟢 Низкий</option></select><textarea id="bug-description" placeholder="Описание и условия воспроизведения"></textarea><button class="primary" onclick="addBug()">Добавить баг</button></div>';for(const b of bugs){h+='<div class="card bug-card '+b.priority+'"><h2>#'+b.id+' — '+esc(b.title)+'</h2><div class="muted">'+priorityLabels[b.priority]+' · '+statusLabels[b.status]+' · Добавлен: '+b.createdAt+(b.fixedAt?" · Исправлен: "+b.fixedAt:"")+(b.commit?" · Commit: "+b.commit.slice(0,7):"")+'</div><p>'+esc(b.description)+'</p><div class="bug-actions"><select onchange="changeBugStatus('+b.id+',this.value)">'+Object.entries(statusLabels).map(([k,v])=>'<option value="'+k+'" '+(b.status===k?"selected":"")+'>'+v+'</option>').join("")+'</select><select onchange="changeBugPriority('+b.id+',this.value)">'+Object.entries(priorityLabels).map(([k,v])=>'<option value="'+k+'" '+(b.priority===k?"selected":"")+'>'+v+'</option>').join("")+'</select></div></div>'}document.getElementById("bugs-app").innerHTML=h}
async function saveBugs(){const r=await fetch("/api/bugs?token="+encodeURIComponent(TOKEN),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({bugs})});const j=await r.json();if(!j.success)throw new Error(j.error||"Не удалось сохранить баги");bugs=j.bugs||bugs;renderBugs();const s=document.getElementById("status");s.className="status success";s.textContent="✅ Реестр багов сохранён и закоммичен."}
async function addBug(){const title=document.getElementById("bug-title").value.trim();if(!title)return;const max=bugs.reduce((m,b)=>Math.max(m,Number(b.id)||0),0);bugs.push({id:max+1,title,priority:document.getElementById("bug-priority").value,status:"open",createdAt:new Date().toISOString().slice(0,10),fixedAt:null,commit:null,description:document.getElementById("bug-description").value.trim()});await saveBugs()}
async function changeBugStatus(id,status){const b=bugs.find(x=>x.id===id);if(!b)return;b.status=status;b.fixedAt=status==="fixed"?(b.fixedAt||new Date().toISOString().slice(0,10)):null;await saveBugs()}
async function changeBugPriority(id,priority){const b=bugs.find(x=>x.id===id);if(!b)return;b.priority=priority;await saveBugs()}
function setPath(obj,path,val,kind){const p=path.split(".");let x=obj;for(let i=0;i<p.length-1;i++)x=x[p[i]];x[p[p.length-1]]=kind==="text"?val.split(",").map(s=>s.trim()).filter(Boolean):Number(val)}
async function saveToGithub(){await save(false,true)}
async function save(commit,push=false){document.querySelectorAll("[data-path]").forEach(el=>setPath(data,el.dataset.path,el.value,el.dataset.kind));const r=await fetch("/api/save?token="+encodeURIComponent(TOKEN),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({data,commit,push})});const j=await r.json();const status=document.getElementById("status");if(j.success&&j.sha){status.className="status success";status.innerHTML="✅ Баланс успешно отправлен в GitHub.<br>Commit: <code>"+j.sha.slice(0,7)+"</code> — <a href=\""+j.commitUrl+"\" target=\"_blank\" rel=\"noopener\">Открыть commit на GitHub ↗</a>"}else{status.className="status";status.textContent=j.message||j.error||"Готово"}if(j.data){data=j.data;render()}}
init().catch(e=>document.getElementById("status").innerHTML='<span class="danger">'+e+"</span>");
</script></main></body></html>
