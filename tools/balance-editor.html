<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starfall Dash — Balance Editor</title><style>
body{margin:0;background:#070b18;color:#eef;font:14px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 6px}.muted{opacity:.65}.toolbar{position:sticky;top:0;background:#0b1020ee;padding:12px 0;z-index:5;display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 14px;background:#202a48;color:#fff;font-weight:800;cursor:pointer}button.primary{background:#6d5dfc}.card{background:#10172b;border:1px solid #263454;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field span{font-size:11px;opacity:.65}.field input{background:#080d1d;color:#fff;border:1px solid #2d3b5d;border-radius:8px;padding:9px}.stage{border-left:3px solid #7cffb2}.status{min-height:24px;margin-top:10px}.danger{color:#ff879b}</style></head><body><main>
<h1>🛠 Starfall Dash — Balance Editor</h1><div class="muted">Локальный Dev Tool. Он не является частью игровой сборки.</div>
<div class="toolbar"><button class="primary" onclick="save(false)">💾 Сохранить</button><button onclick="save(true)">💾 Сохранить + Git commit</button><button onclick="location.reload()">↻ Перезагрузить</button></div>
<div id="app"></div><div id="status" class="status"></div>
<script>
const TOKEN=new URLSearchParams(location.search).get("token")||location.hash.slice(1);let data;
async function init(){data=await(await fetch("/api/balance?token="+encodeURIComponent(TOKEN))).json();render()}
function inp(path,label,value,step="1"){return '<label class="field"><span>'+label+'</span><input data-path="'+path+'" data-kind="number" type="number" step="'+step+'" value="'+value+'"></label>'} function textInp(path,label,value){return '<label class="field"><span>'+label+'</span><input data-path="'+path+'" data-kind="text" type="text" value="'+(value||[]).join(", ")+'"></label>'}
function render(){
 let h='<div class="card"><h2>⚙️ Система спавна</h2><div class="grid">'+inp("rogue.spawn.minIntervalFrames","Мин. интервал",data.rogue.spawn.minIntervalFrames)+inp("rogue.spawn.pressureIntervalFrames","Давление: интервал",data.rogue.spawn.pressureIntervalFrames)+inp("rogue.spawn.pressureMaxPerTick","Давление: максимум",data.rogue.spawn.pressureMaxPerTick)+'</div></div>';
 for(const [planet,stages] of Object.entries(data.rogue.stages)){h+='<div class="card"><h2>🪐 '+planet.toUpperCase()+'</h2>';stages.forEach((s,i)=>{h+='<div class="card stage"><h3>Этап '+(i+1)+'</h3><div class="grid">'+textInp("rogue.stages."+planet+"."+i+".pool","Типы врагов",s.pool)+inp("rogue.stages."+planet+"."+i+".spawnInterval","Спавн (кадры)",s.spawnInterval)+inp("rogue.stages."+planet+"."+i+".maxAlive","Макс. врагов",s.maxAlive)+inp("rogue.stages."+planet+"."+i+".minAlive","Мин. врагов",s.minAlive)+inp("rogue.stages."+planet+"."+i+".speedMult","Множитель скорости",s.speedMult,"0.01")+inp("rogue.stages."+planet+"."+i+".hpMult","Множитель HP",s.hpMult,"0.01")+inp("rogue.stages."+planet+"."+i+".objective.target","Цель этапа",s.objective.target)+'</div></div>'});h+='</div>'}
 h+='<div class="card"><h2>👾 Враги</h2><div class="grid">';for(const[k,e]of Object.entries(data.rogue.enemies)){h+='<div class="card"><h3>'+k+'</h3><div class="grid">'+inp("rogue.enemies."+k+".hp","HP",e.hp)+inp("rogue.enemies."+k+".speed","Скорость",e.speed,"0.1")+inp("rogue.enemies."+k+".size","Размер",e.size)+'</div></div>'}h+='</div></div>';
 h+='<div class="card"><h2>👑 Боссы</h2><div class="grid">';for(const[k,b]of Object.entries(data.rogue.bosses)){h+='<div class="card"><h3>'+k+'</h3><div class="grid">'+inp("rogue.bosses."+k+".hp","HP",b.hp)+inp("rogue.bosses."+k+".size","Размер",b.size)+inp("rogue.bosses."+k+".rewardGold","Золото",b.rewardGold)+inp("rogue.bosses."+k+".rewardCrystals","Кристаллы",b.rewardCrystals)+'</div></div>'}h+='</div></div>';
 document.getElementById("app").innerHTML=h;
}
function setPath(obj,path,val,kind){const p=path.split(".");let x=obj;for(let i=0;i<p.length-1;i++)x=x[p[i]];x[p[p.length-1]]=kind==="text"?val.split(",").map(s=>s.trim()).filter(Boolean):Number(val)}
async function save(commit){document.querySelectorAll("[data-path]").forEach(el=>setPath(data,el.dataset.path,el.value,el.dataset.kind));const r=await fetch("/api/save?token="+encodeURIComponent(TOKEN),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({data,commit})});const j=await r.json();document.getElementById("status").textContent=j.message||j.error||"Готово";if(j.data){data=j.data;render()}}
init().catch(e=>document.getElementById("status").innerHTML='<span class="danger">'+e+"</span>");
</script></main></body></html>
