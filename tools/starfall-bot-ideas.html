<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starfall Dash — Идеи обновлений</title>
<style>
:root{--bg:#050918;--panel:rgba(8,18,48,.9);--line:#294f9e;--cyan:#48d9ff;--violet:#8a4dff;--text:#eef4ff;--muted:#91a4d4;--good:#36efb1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 80% 15%,rgba(65,100,255,.2),transparent 28%),linear-gradient(180deg,#030717,#07102a 58%,#040817)}main{max-width:1100px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.brand{display:flex;gap:13px;align-items:center}.icon{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,#162e72,#0b1739);border:1px solid #3564e8}.brand h1{margin:0;font-size:25px}.brand p{margin:4px 0 0;color:var(--muted)}a{color:#9bbaff;text-decoration:none}.card{background:linear-gradient(145deg,rgba(13,29,67,.9),rgba(6,16,40,.94));border:1px solid #244a9f;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 18px 50px rgba(0,0,0,.25)}h2{margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 220px;gap:12px}label{display:flex;flex-direction:column;gap:7px;color:#9cafdf;font-size:12px;font-weight:700}input,select,textarea{width:100%;background:#050d21;color:#fff;border:1px solid #29457f;border-radius:10px;padding:11px;outline:0}textarea{min-height:85px;resize:vertical}button{border:1px solid #294a9e;border-radius:10px;padding:11px 15px;background:#17264e;color:#fff;font-weight:800;cursor:pointer}button.primary{background:linear-gradient(135deg,#7b4dff,#4d73ff);border-color:#a58cff}.idea{background:rgba(5,14,34,.8);border:1px solid #263d70;border-radius:12px;margin:10px 0;overflow:hidden}.idea.open{border-color:#5a70c5}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}.title{font-size:16px;font-weight:800}.content{display:none;padding:0 16px 16px;border-top:1px solid rgba(80,110,180,.35)}.idea.open .content{display:block}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.pill{padding:6px 9px;background:#132348;border:1px solid #29477f;border-radius:20px}.desc{white-space:pre-wrap;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.edit{display:none}.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{color:var(--good);min-height:20px}.muted{color:var(--muted)}@media(max-width:700px){.top{align-items:flex-start}.grid,.filters{grid-template-columns:1fr}.brand h1{font-size:20px}}
</style></head><body><main>
<div class="top"><div class="brand"><div class="icon">💡</div><div><h1>Идеи обновлений</h1><p>Starfall Dash Bot Lab · отдельный список идей по принципу раздела «Баги»</p></div></div><a href="/">← Вернуться в Bot Lab</a></div>
<div class="card"><h2>💡 Добавить новую идею</h2><div class="grid"><label>Название<input id="title" placeholder="Например: добавить новый режим"></label><label>Приоритет<select id="priority"><option value="high">🟠 Высокий</option><option value="medium" selected>🟡 Средний</option><option value="low">🟢 Низкий</option></select></label></div><br><label>Описание<textarea id="description" placeholder="Что именно хочется добавить и зачем"></textarea></label><br><button class="primary" id="add">➕ Добавить идею</button><div class="msg" id="msg"></div></div>
<div class="card"><h2>🔎 Фильтрация</h2><div class="filters"><label>Статус<select id="filterStatus"><option value="all">Все статусы</option><option value="planned">📝 Запланирована</option><option value="done">✅ Реализована</option><option value="rejected">🚫 Отклонена</option></select></label><label>Приоритет<select id="filterPriority"><option value="all">Все приоритеты</option><option value="high">🟠 Высокий</option><option value="medium">🟡 Средний</option><option value="low">🟢 Низкий</option></select></label></div><div class="muted" id="summary" style="margin-top:10px"></div></div>
<div id="list"></div>
</main><script>
const $=id=>document.getElementById(id);let data={version:1,nextId:1,ideas:[]};
const pr={high:"🟠 Высокий",medium:"🟡 Средний",low:"🟢 Низкий"},st={planned:"📝 Запланирована",done:"✅ Реализована",rejected:"🚫 Отклонена"};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function load(){const r=await fetch("/api/ideas");data=await r.json();render()}
function render(){const fs=$("filterStatus").value,fp=$("filterPriority").value;const arr=data.ideas.filter(x=>(fs==="all"||x.status===fs)&&(fp==="all"||x.priority===fp));$("summary").textContent="Показано: "+arr.length+" из "+data.ideas.length;
$("list").innerHTML=arr.length?arr.map(x=>'<div class="idea" data-id="'+x.id+'"><div class="head"><span class="title">#'+x.id+" — "+esc(x.title)+'</span><button data-open="'+x.id+'">▸</button></div><div class="content"><div class="meta"><span class="pill">'+pr[x.priority]+'</span><span class="pill">'+st[x.status]+'</span><span class="pill">'+esc(x.createdAt)+'</span></div><div class="view"><div class="desc">'+esc(x.description)+'</div><div class="actions"><button data-edit="'+x.id+'">✏️ Редактировать</button></div></div><div class="edit"><label>Название<input data-title="'+x.id+'" value="'+esc(x.title)+'"></label><br><label>Приоритет<select data-priority="'+x.id+'">'+Object.keys(pr).map(k=>'<option value="'+k+'" '+(k===x.priority?"selected":"")+'>'+pr[k]+'</option>').join("")+'</select></label><br><label>Описание<textarea data-description="'+x.id+'">'+esc(x.description)+'</textarea></label><br><label>Статус<select data-status="'+x.id+'">'+Object.keys(st).map(k=>'<option value="'+k+'" '+(k===x.status?"selected":"")+'>'+st[k]+'</option>').join("")+'</select></label><div class="actions"><button class="primary" data-save="'+x.id+'">💾 Сохранить</button><button data-cancel="'+x.id+'">Отмена</button></div></div></div></div>').join(""):'<div class="card muted">По выбранным фильтрам идей нет.</div>';
document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const c=b.closest(".idea");c.classList.toggle("open");b.textContent=c.classList.contains("open")?"▾":"▸"});
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const c=b.closest(".idea");c.querySelector(".view").style.display="none";c.querySelector(".edit").style.display="block"});
document.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=render);
document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const id=Number(b.dataset.save),x=data.ideas.find(i=>i.id===id);if(!x)return;x.title=document.querySelector('[data-title="'+id+'"]').value.trim();x.description=document.querySelector('[data-description="'+id+'"]').value.trim();x.priority=document.querySelector('[data-priority="'+id+'"]').value;x.status=document.querySelector('[data-status="'+id+'"]').value;x.updatedAt=new Date().toISOString().slice(0,10);await save();});
}
async function save(){const r=await fetch("/api/ideas",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const out=await r.json();$("msg").textContent=out.success?"Сохранено в Bot Lab и GitHub.":"Ошибка сохранения: "+(out.message||"неизвестная");await load()}
$("add").onclick=async()=>{const title=$("title").value.trim();if(!title){$("msg").textContent="Введите название идеи.";return}data.ideas.unshift({id:data.nextId++,title,priority:$("priority").value,status:"planned",createdAt:new Date().toISOString().slice(0,10),updatedAt:null,description:$("description").value.trim()});$("title").value="";$("description").value="";await save()};
$("filterStatus").onchange=render;$("filterPriority").onchange=render;load();
</script></body></html>
