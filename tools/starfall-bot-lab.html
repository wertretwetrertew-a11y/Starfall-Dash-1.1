<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starfall Dash Bot Lab</title><style>body{margin:0;background:#070b18;color:#eef;font:14px system-ui}main{max-width:1100px;margin:auto;padding:20px}.tabs,button{display:flex;gap:8px}button{border:0;border-radius:9px;padding:10px 14px;background:#202a48;color:#fff;font-weight:700;cursor:pointer}.on,.primary{background:#6d5dfc}.card{background:#10172b;border:1px solid #263454;border-radius:14px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field span{font-size:11px;opacity:.65}input,select{background:#080d1d;color:#fff;border:1px solid #2d3b5d;border-radius:8px;padding:9px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric{background:#0b1122;padding:12px;border-radius:10px}.metric b{display:block;font-size:22px;margin-top:4px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #202b47;text-align:left}.scroll{overflow:auto}.good{color:#7cffb2}.bad{color:#ff879b}.pill{display:inline-block;padding:5px 8px;background:#1a2440;border-radius:20px;margin:3px}</style><main><h1>🤖 Starfall Dash — Bot Lab</h1><div style="opacity:.65">Бот-тестер, статистика и ручной баланс в одном приложении</div><div class="tabs"><button class="on" data-x="test">🤖 Тест</button><button data-x="stats">📊 Статистика</button><button data-x="bal">⚙️ Баланс</button></div><section id="test"><div class="card"><h2>Запуск</h2><div class="grid"><label class="field"><span>Профиль</span><select id="p"><option value="novice">Новичок</option><option value="average" selected>Обычный</option><option value="optimal">Оптимальный</option></select></label><label class="field"><span>Забегов</span><input id="n" value="500" type="number" min="1" max="10000"></label><label class="field"><span>Стартовый урон</span><input id="d" value="1" type="number" step=".1"></label><label class="field"><span>Стартовое HP</span><input id="hp" value="3" type="number"></label></div><br><button class="primary" id="go">▶ Запустить бота</button> <button id="all">⚡ Все профили</button><p id="msg"></p><small>Симулятор использует текущий Roguelike-баланс и ничего не меняет автоматически.</small></div></section><section id="stats" style="display:none"><div class="card"><h2>📊 Статистика</h2><div id="sum" class="cards"></div></div><div class="card"><h2>Этапы</h2><div class="scroll"><table id="st"></table></div></div><div class="card"><h2>Враги</h2><div class="scroll"><table id="en"></table></div></div><div class="card"><h2>Боссы</h2><div class="scroll"><table id="bo"></table></div></div><div class="card"><h2>Апгрейды</h2><div id="up"></div></div></section><section id="bal" style="display:none"><div class="card"><button id="gh">☁️ Сохранить в GitHub</button> <button id="loc">💾 Локально</button><p id="bs"></p></div><div id="editor"></div></section></main><script>const t=new URLSearchParams(location.search).get('token'),$=x=>document.getElementById(x);let data,last;document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-x]').forEach(x=>x.classList.remove('on'));b.classList.add('on');['test','stats','bal'].forEach(x=>$(x).style.display=x==b.dataset.x?'block':'none')});async function load(){data=await(await fetch('/api/balance?token='+encodeURIComponent(t))).json();renderEditor()}function metric(a,b){return '<div class="metric">'+a+'<b>'+b+'</b></div>'}function pct(a,b){return b?(a/b*100).toFixed(1):0}function fmt(x){x=+x||0;return Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0')}async function run(profile){$('msg').textContent='⏳ Тест...';let r=await fetch('/api/run?token='+encodeURIComponent(t),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profile,runs:+$('n').value,baseDamage:+$('d').value,baseHp:+$('hp').value,seed:20260929})});last=await r.json();$('msg').textContent='✅ Готово';render(last);document.querySelector('[data-x="stats"]').click()}$('go').onclick=()=>run($('p').value);$('all').onclick=async()=>{let z=[];for(let p of ['novice','average','optimal']){let r=await fetch('/api/run?token='+encodeURIComponent(t),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profile:p,runs:+$('n').value,baseDamage:+$('d').value,baseHp:+$('hp').value,seed:20260929})});z.push(await r.json())}$('msg').innerHTML=z.map(x=>x.meta.profile+': <b>'+pct(x.summary.completed,x.summary.started)+'%</b>').join(' · ');last=z[1];render(last);document.querySelector('[data-x="stats"]').click()};function render(r){$('sum').innerHTML=metric('Полное прохождение',pct(r.summary.completed,r.summary.started)+'%')+metric('Смерти',r.summary.deaths)+metric('Этапы',r.summary.stagesCompleted)+metric('Боссы',r.summary.bossesDefeated+'/'+r.summary.bossesAttempted)+metric('Время',fmt(r.summary.avgSurvivalSeconds))+metric('Убийства',r.summary.avgKills.toFixed(1))+metric('Урон',r.summary.avgDamageTaken.toFixed(1));$('st').innerHTML='<tr><th>Планета</th><th>Этап</th><th>Попытки</th><th>Прошли</th><th>%</th></tr>'+r.stages.map(s=>'<tr><td>'+s.planet+'</td><td>'+s.stage+'</td><td>'+s.attempts+'</td><td>'+s.completed+'</td><td>'+pct(s.completed,s.attempts)+'%</td></tr>').join('');$('en').innerHTML='<tr><th>Враг</th><th>Убит</th><th>Смерти бота</th><th>Урон</th></tr>'+Object.entries(r.enemies).map(([k,e])=>'<tr><td>'+k+'</td><td>'+e.killed+'</td><td class="'+(e.deaths?'bad':'')+'">'+e.deaths+'</td><td>'+e.damageTaken.toFixed(1)+'</td></tr>').join('');$('bo').innerHTML='<tr><th>Босс</th><th>Попытки</th><th>Победы</th><th>Смерти</th></tr>'+Object.entries(r.bosses).map(([k,e])=>'<tr><td>'+k+'</td><td>'+e.attempted+'</td><td>'+e.defeated+'</td><td>'+e.deaths+'</td></tr>').join('');$('up').innerHTML=Object.values(r.upgrades).sort((a,b)=>b.picked-a.picked).map(e=>'<span class="pill">'+e.label+': '+e.picked+'</span>').join('')}function inp(p,l,v){return '<label class="field"><span>'+l+'</span><input data-p="'+p+'" value="'+v+'" type="number"></label>'}function renderEditor(){let h='';for(let [pl,ss] of Object.entries(data.rogue.stages)){h+='<div class="card"><h2>'+pl.toUpperCase()+'</h2>';ss.forEach((s,i)=>h+='<div class="card"><b>Этап '+(i+1)+' · '+s.objective.kind+'</b><div class="grid">'+inp('rogue.stages.'+pl+'.'+i+'.spawnInterval','Спавн',s.spawnInterval)+inp('rogue.stages.'+pl+'.'+i+'.maxAlive','Макс. врагов',s.maxAlive)+inp('rogue.stages.'+pl+'.'+i+'.objective.target','Цель',s.objective.target)+'</div></div>');h+='</div>'}h+='<div class="card"><h2>Враги</h2><div class="grid">';for(let[k,e]of Object.entries(data.rogue.enemies))h+=inp('rogue.enemies.'+k+'.hp',k+' HP',e.hp);h+='</div></div><div class="card"><h2>Боссы</h2><div class="grid">';for(let[k,e]of Object.entries(data.rogue.bosses))h+=inp('rogue.bosses.'+k+'.hp',k+' HP',e.hp);h+='</div></div>';$('editor').innerHTML=h}function collect(){document.querySelectorAll('[data-p]').forEach(e=>{let a=e.dataset.p.split('.'),x=data;for(let i=0;i<a.length-1;i++)x=x[a[i]];x[a[a.length-1]]=Number(e.value)})}async function save(push){collect();let r=await fetch('/api/save?token='+encodeURIComponent(t),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({data,commit:push,push})}),j=await r.json();$('bs').className=j.success?'good':'';$('bs').innerHTML=j.success?'✅ GitHub обновлён. Commit: '+j.sha.slice(0,7)+' · <a target="_blank" href="'+j.commitUrl+'">Открыть commit</a>':(j.message||j.error)}$('gh').onclick=()=>save(true);$('loc').onclick=()=>save(false);load()</script></html>
